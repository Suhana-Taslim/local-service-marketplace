spring.datasource.url=jdbc:mysql://localhost:3306/local_service_marketplace
spring.datasource.username=marketplace_user
spring.datasource.password=marketplace123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Configure these environment variables to send verification and reset emails.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}