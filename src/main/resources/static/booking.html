<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Service | Local Services</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f4f0e6, #eee5ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            color: #6c3bd1;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #7c3aed;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .service-info {
            background: #f4efff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 22px;
        }

        .service-info strong {
            color: #6c3bd1;
        }

        .payment-info {
            background: #f5f5f5;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #444;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #7c3aed;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6426c5;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Book a Service</h1>
        <p>Schedule a local professional at your convenience.</p>
    </div>

    <div class="service-info">
        <strong>Service ID:</strong>
        <span id="serviceIdDisplay">Loading...</span>
    </div>

    <form id="bookingForm">

        <input type="hidden" id="serviceId">

        <div class="field">
            <label>Booking Date *</label>
            <input type="date" id="bookingDate" required>
        </div>

        <div class="field">
            <label>Preferred Time</label>
            <input type="time" id="bookingTime">
        </div>

        <div class="field">
            <label>Service Address *</label>
            <textarea id="address"
                      placeholder="Enter the address where the service is required"
                      required></textarea>
        </div>

        <div class="payment-info">
            <strong>Payment:</strong>
            Offline payment — pay the service provider directly.
            No online payment is required.
        </div>

        <button type="submit">
            Confirm Booking
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="back">
        <a href="customer.html">← Back to Customer Dashboard</a>
    </div>

</div>

<script>

const userId = localStorage.getItem("userId");
const serviceId =
    new URLSearchParams(window.location.search)
        .get("serviceId");

const serviceIdInput =
    document.getElementById("serviceId");

const serviceIdDisplay =
    document.getElementById("serviceIdDisplay");

const bookingDate =
    document.getElementById("bookingDate");


// Check login
if (!userId) {

    alert("Please login before booking a service.");

    window.location.href = "login.html";
}


// Check service
if (!serviceId) {

    serviceIdDisplay.textContent =
        "No service selected";

} else {

    serviceIdInput.value = serviceId;

    serviceIdDisplay.textContent = serviceId;
}


// Prevent selecting a past date
const today =
    new Date().toISOString().split("T")[0];

bookingDate.min = today;


document.getElementById("bookingForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const message =
        document.getElementById("message");

    if (!serviceId) {

        message.textContent =
            "Please select a service first.";

        return;
    }

    const booking = {

        customerId: Number(userId),

        serviceId: Number(serviceId),

        bookingDate:
            document.getElementById("bookingDate").value,

        bookingTime:
            document.getElementById("bookingTime").value || null,

        address:
            document.getElementById("address").value.trim(),

        status: "PENDING"
    };


    message.textContent =
        "Creating your booking...";


    try {

        const response = await fetch(
            "/api/bookings",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(booking)
            }
        );


        if (!response.ok) {

            const error =
                await response.text();

            message.textContent =
                error || "Booking failed.";

            return;
        }


        const result =
            await response.json();


        message.textContent =
            "Booking successful! Booking ID: "
            + result.id;


        setTimeout(() => {

            window.location.href =
                "customer.html";

        }, 1800);


    } catch (error) {

        console.error(error);

        message.textContent =
            "Unable to connect to the server.";
    }

});

</script>

</body>
</html>
