<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Service - Local Services</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f0e6;
            color: #21152b;
        }

        header {
            background: #21152b;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #6c63ff;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Local Service Marketplace</h1>
    <a href="customer.html">Dashboard</a>
</header>

<div class="container">

    <div class="box">

        <h2>Book a Service</h2>
        <p>Enter your booking details below.</p>

        <form id="bookingForm">

            <label>Customer ID</label>
            <input type="number" id="customerId" value="1" required>

            <label>Service ID</label>
            <input type="number" id="serviceId" required>

            <label>Booking Date</label>
            <input type="date" id="bookingDate" required>

            <label>Booking Time</label>
            <input type="time" id="bookingTime" required>

            <label>Address</label>
            <input type="text" id="address"
                   placeholder="Enter service address" required>

            <button type="submit">Confirm Booking</button>

        </form>

        <p id="message"></p>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const serviceId = params.get("serviceId");

if (serviceId) {
    document.getElementById("serviceId").value = serviceId;
}

document.getElementById("bookingForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const booking = {
        customerId: parseInt(document.getElementById("customerId").value),
        serviceId: parseInt(document.getElementById("serviceId").value),
        bookingDate: document.getElementById("bookingDate").value,
        bookingTime: document.getElementById("bookingTime").value,
        address: document.getElementById("address").value,
        status: "PENDING"
    };

    const message = document.getElementById("message");

    try {

        const response = await fetch("/api/bookings", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(booking)
        });

        if (response.ok) {

            const result = await response.json();

            message.style.color = "green";
            message.textContent =
                "Booking successful! Booking ID: " + result.id;

            document.getElementById("bookingForm").reset();

            if (serviceId) {
                document.getElementById("serviceId").value = serviceId;
            }

        } else {

            message.style.color = "red";
            message.textContent = "Booking failed.";

        }

    } catch (error) {

        message.style.color = "red";
        message.textContent = "Unable to connect to server.";

    }

});

</script>

</body>
</html>
