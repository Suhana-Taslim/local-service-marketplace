<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Provider Dashboard | Local Services</title>

    <style>
        :root {
            --bg: #050807;
            --panel: #0c1411;
            --panel-soft: #f3f9f4;
            --text: #f4f9f5;
            --text-dark: #101010;
            --muted: #b7c7bb;
            --accent: #b6ff4a;
            --accent-strong: #87ef06;
            --danger: #ff5f5f;
            --danger-strong: #e33535;
            --success: #6ae463;
            --shadow: rgba(0,0,0,0.32);
            --border: rgba(182,255,74,0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #0f1a14 0%, #050807 38%, #020302 100%);
            color: var(--text);
        }

        header {
            background: #040605;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 0.08em;
            color: var(--accent);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .provider-name {
            color: var(--text);
            font-weight: 600;
        }

        .logout {
            border: 1px solid var(--accent);
            padding: 9px 15px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--text-dark);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(182,255,74,0.2);
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .welcome {
            background: linear-gradient(180deg, var(--panel), #09110d);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px var(--shadow);
        }

        .welcome h1 {
            color: var(--accent);
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--muted);
        }

        .controls {
            background: linear-gradient(180deg, #101d18, #0a120f);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 28px;
            box-shadow: 0 6px 18px var(--shadow);
        }

        .controls h2 {
            color: white;
            margin-bottom: 15px;
        }

        .control-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .control-btn {
            border: none;
            padding: 11px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: bold;
        }

        .available-btn {
            background: rgba(182,255,74,0.18);
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .unavailable-btn {
            background: rgba(255,95,95,0.15);
            color: #ffaaaa;
            border: 1px solid rgba(255,95,95,0.35);
        }

        .emergency-btn {
            background: rgba(182,255,74,0.18);
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .section {
            margin-top: 35px;
        }

        .section h2 {
            color: white;
            margin-bottom: 15px;
        }

        .card {
            background: linear-gradient(180deg, #ffffff, #edf7ea);
            color: var(--text-dark);
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 15px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.22);
        }

        .card h3 {
            color: #111111;
            margin-bottom: 12px;
        }

        .row {
            margin: 7px 0;
            color: #383838;
        }

        .status {
            display: inline-block;
            margin-top: 12px;
            padding: 7px 12px;
            border-radius: 15px;
            background: rgba(182,255,74,0.12);
            border: 1px solid var(--border);
            font-size: 13px;
            font-weight: bold;
            color: #111111;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .action-btn {
            border: none;
            padding: 10px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .accept {
            background: rgba(106,228,99,0.18);
            color: #124d22;
        }

        .reject {
            background: rgba(255,95,95,0.16);
            color: #800f0f;
        }

        .complete {
            background: rgba(182,255,74,0.18);
            color: #101010;
        }

        .empty {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 28px;
            border-radius: 15px;
            text-align: center;
            color: var(--muted);
        }

        .message {
            margin-top: 12px;
            color: var(--accent);
            font-weight: bold;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                align-items: flex-start;
                padding: 15px 20px;
            }

            .header-right {
                width: 100%;
                justify-content: space-between;
            }

            .container {
                width: 94%;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="brand">
        LOCAL SERVICES
    </div>

    <div class="header-right">

        <span class="provider-name" id="providerName">
            Provider
        </span>

        <button class="delete-account" onclick="deleteAccount()">
    Delete Account
</button>

<button class="logout" onclick="logout()">
    Logout
</button>

    </div>

</header>


<div class="container">

    <div class="welcome">

        <h1>
            Provider Dashboard
        </h1>

        <p>
            Manage your service bookings and emergency requests.
        </p>

    </div>


    <div class="controls">

        <h2>
            Availability
        </h2>

        <div class="control-row">

            <button
                class="control-btn available-btn"
                onclick="setAvailability(true)">
                Available for Bookings
            </button>

            <button
                class="control-btn unavailable-btn"
                onclick="setAvailability(false)">
                Temporarily Unavailable
            </button>

            <button
                class="control-btn emergency-btn"
                onclick="setEmergencyAvailability(true)">
                Accept Emergency Requests
            </button>

            <button
                class="control-btn unavailable-btn"
                onclick="setEmergencyAvailability(false)">
                Stop Emergency Requests
            </button>

        </div>

        <div id="controlMessage" class="message"></div>

    </div>


    <div class="section">

        <h2>
            My Service Bookings
        </h2>

        <div id="bookingsContainer">

            <div class="empty">
                Loading bookings...
            </div>

        </div>

    </div>


    <div class="section">

        <h2>
            Emergency Requests
        </h2>

        <div id="emergencyContainer">

            <div class="empty">
                Loading emergency requests...
            </div>

        </div>

    </div>

</div>


<script>

const userId =
    localStorage.getItem("userId");

const userName =
    localStorage.getItem("userName");

const userRole =
    localStorage.getItem("userRole");


if (!userId || userRole !== "PROVIDER") {

    alert("Please login as a service provider.");

    window.location.href =
        "login.html";
}


document.getElementById("providerName")
    .textContent = userName || "Provider";


let providerId = null;


/*
 * Find the provider profile belonging
 * to the currently logged-in provider.
 */
async function loadProvider() {

    try {

        const response =
            await fetch("/api/providers");

        if (!response.ok) {
            throw new Error("Unable to load providers");
        }

        const providers =
            await response.json();


        const provider =
            providers.find(
                p => Number(p.userId) === Number(userId)
            );


        if (!provider) {

            alert(
                "Provider profile not found."
            );

            return;
        }


        providerId =
            provider.id;


        loadBookings();
        loadEmergencyRequests();

    } catch (error) {

        console.error(error);

        document.getElementById(
            "bookingsContainer"
        ).innerHTML = `
            <div class="empty">
                Unable to load provider profile.
            </div>
        `;
    }
}


async function loadBookings() {

    const container =
        document.getElementById(
            "bookingsContainer"
        );


    try {

        const response =
            await fetch(
                `/api/bookings/provider/${providerId}`
            );


        if (!response.ok) {
            throw new Error("Unable to load bookings");
        }


        const bookings =
            await response.json();


        if (!bookings.length) {

            container.innerHTML = `
                <div class="empty">
                    No bookings assigned to you yet.
                </div>
            `;

            return;
        }


        container.innerHTML =
            bookings.map(
                booking => `

                <div class="card">

                    <h3>
                        Booking #${booking.id}
                    </h3>

                    <div class="row">
                        Customer ID:
                        ${booking.customerId}
                    </div>

                    <div class="row">
                        Service ID:
                        ${booking.serviceId}
                    </div>

                    <div class="row">
                        Date:
                        ${booking.bookingDate}
                    </div>

                    <div class="row">
                        Time:
                        ${booking.bookingTime || "Not specified"}
                    </div>

                    <div class="row">
                        Address:
                        ${escapeHtml(
                            booking.address || "Not provided"
                        )}
                    </div>

                    <span class="status">
                        ${booking.status}
                    </span>

                    ${booking.status === "PENDING" ? `

                        <div class="actions">

                            <button
                                class="action-btn accept"
                                onclick="updateBooking(
                                    ${booking.id},
                                    'ACCEPTED'
                                )">
                                Accept
                            </button>

                            <button
                                class="action-btn reject"
                                onclick="updateBooking(
                                    ${booking.id},
                                    'REJECTED'
                                )">
                                Reject
                            </button>

                        </div>

                    ` : ""}


                    ${booking.status === "ACCEPTED" ? `

                        <div class="actions">

                            <button
                                class="action-btn complete"
                                onclick="updateBooking(
                                    ${booking.id},
                                    'COMPLETED'
                                )">
                                Mark Completed
                            </button>

                        </div>

                    ` : ""}

                </div>

            `
            ).join("");


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Unable to load bookings.
            </div>
        `;
    }
}


async function updateBooking(
    bookingId,
    status
) {

    try {

        const response =
            await fetch(
                `/api/bookings/${bookingId}/status?status=${status}`,
                {
                    method: "PUT"
                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            alert(
                error ||
                "Unable to update booking."
            );

            return;
        }


        loadBookings();

    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to the server."
        );
    }
}


async function loadEmergencyRequests() {

    const container =
        document.getElementById(
            "emergencyContainer"
        );


    try {

        const response =
            await fetch(
                `/api/emergency/provider/${providerId}`
            );


        if (!response.ok) {
            throw new Error(
                "Unable to load emergency requests"
            );
        }


        const requests =
            await response.json();


        if (!requests.length) {

            container.innerHTML = `
                <div class="empty">
                    No emergency requests assigned to you.
                </div>
            `;

            return;
        }


        container.innerHTML =
            requests.map(
                request => `

                <div class="card">

                    <h3>
                        Emergency Request #${request.id}
                    </h3>

                    <div class="row">
                        Service:
                        ${escapeHtml(
                            request.serviceCategory
                        )}
                    </div>

                    <div class="row">
                        Customer ID:
                        ${request.customerId}
                    </div>

                    <div class="row">
                        Description:
                        ${escapeHtml(
                            request.description ||
                            "No description provided"
                        )}
                    </div>

                    <div class="row">
                        Address:
                        ${escapeHtml(
                            request.address ||
                            "Not provided"
                        )}
                    </div>

                    <span class="status">
                        ${request.status}
                    </span>

                    ${request.status === "MATCHED" ? `

                        <div class="actions">

                            <button
                                class="action-btn accept"
                                onclick="updateEmergency(
                                    ${request.id},
                                    'ACCEPTED'
                                )">
                                Accept Emergency
                            </button>

                            <button
                                class="action-btn reject"
                                onclick="updateEmergency(
                                    ${request.id},
                                    'REJECTED'
                                )">
                                Reject
                            </button>

                        </div>

                    ` : ""}


                    ${request.status === "ACCEPTED" ? `

                        <div class="actions">

                            <button
                                class="action-btn complete"
                                onclick="updateEmergency(
                                    ${request.id},
                                    'COMPLETED'
                                )">
                                Mark Completed
                            </button>

                        </div>

                    ` : ""}

                </div>

            `
            ).join("");


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Unable to load emergency requests.
            </div>
        `;
    }
}


async function updateEmergency(
    requestId,
    status
) {

    try {

        const response =
            await fetch(
                `/api/emergency/${requestId}/status?status=${status}`,
                {
                    method: "PUT"
                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            alert(
                error ||
                "Unable to update emergency request."
            );

            return;
        }


        loadEmergencyRequests();

    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to the server."
        );
    }
}


/*
 * These two controls are displayed now.
 * The backend update endpoint will be connected
 * in the next backend step.
 */

async function setAvailability(value) {

    if (!providerId) {
        return;
    }

    try {

        const response = await fetch(
            `/api/providers/${providerId}/availability?available=${value}`,
            {
                method: "PUT"
            }
        );

        if (!response.ok) {
            throw new Error("Update failed");
        }

        document.getElementById(
            "controlMessage"
        ).textContent =
            value
                ? "You are now available for bookings."
                : "You are now unavailable for bookings.";

    } catch (error) {

        console.error(error);

        document.getElementById(
            "controlMessage"
        ).textContent =
            "Unable to update availability.";
    }
}


async function setEmergencyAvailability(value) {

    if (!providerId) {
        return;
    }

    try {

        const response = await fetch(
            `/api/providers/${providerId}/emergency-availability?available=${value}`,
            {
                method: "PUT"
            }
        );

        if (!response.ok) {
            throw new Error("Update failed");
        }

        document.getElementById(
            "controlMessage"
        ).textContent =
            value
                ? "You are now accepting emergency requests."
                : "You are no longer accepting emergency requests.";

    } catch (error) {

        console.error(error);

        document.getElementById(
            "controlMessage"
        ).textContent =
            "Unable to update emergency availability.";
    }
}


function logout() {

    localStorage.removeItem("userId");
    localStorage.removeItem("userName");
    localStorage.removeItem("username");
    localStorage.removeItem("userRole");

    window.location.href =
        "login.html";
}

async function deleteAccount() {

    const confirmed = confirm(
        "Are you sure you want to permanently delete your provider account?"
    );

    if (!confirmed) {
        return;
    }

    const userId = localStorage.getItem("userId");

    if (!userId) {
        alert("Please login again.");
        window.location.href = "login.html";
        return;
    }

    try {
        const response = await fetch(`/api/users/${userId}`, {
            method: "DELETE"
        });

        const result = await response.text();

        if (!response.ok) {
            alert(result || "Unable to delete account.");
            return;
        }

        alert("Your provider account has been deleted successfully.");

        localStorage.clear();
        window.location.href = "index.html";

    } catch (error) {
        console.error(error);
        alert("Unable to connect to the server.");
    }
}

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null ? "" : value;

    return div.innerHTML;
}


loadProvider();

</script>

</body>
</html>
