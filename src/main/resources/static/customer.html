<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Dashboard | Local Services</title>

    <style>
        :root {
            --bg: #050807;
            --bg-card: #0d1512;
            --panel: #111c18;
            --panel-soft: #edf7ea;
            --text: #f4f9f5;
            --text-dark: #101010;
            --muted: #b7c7bb;
            --accent: #b6ff4a;
            --accent-strong: #88f306;
            --accent-deep: #5fd300;
            --danger: #ff5f5f;
            --danger-strong: #e33535;
            --shadow: rgba(0,0,0,0.32);
            --border: rgba(182,255,74,0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #112018 0%, #050807 38%, #020302 100%);
            color: var(--text);
        }

        header {
            background: #040605;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 0.08em;
            color: var(--accent);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-name {
            color: var(--text);
            font-weight: 600;
        }

        .logout {
            border: 1px solid var(--accent);
            padding: 9px 15px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--text-dark);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(182,255,74,0.26);
        }

        .logout:hover {
            background: var(--accent-strong);
        }

        .container {
            width: 92%;
            max-width: 1250px;
            margin: 30px auto;
        }

        .welcome {
            background: linear-gradient(180deg, var(--panel), #0a130f);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px var(--shadow);
        }

        .welcome h1 {
            color: var(--accent);
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--muted);
        }

        .section-title {
            margin-bottom: 15px;
            color: white;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 28px;
        }

        .category-btn {
            border: 1px solid var(--border);
            padding: 11px 17px;
            border-radius: 999px;
            background: transparent;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .category-btn:hover,
        .category-btn.active {
            background: var(--accent);
            color: var(--text-dark);
            box-shadow: 0 0 18px rgba(182,255,74,0.28);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .service-card {
            background: linear-gradient(180deg, #ffffff, #edf7ea);
            color: var(--text-dark);
            padding: 22px;
            border-radius: 17px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.24);
            display: flex;
            flex-direction: column;
            min-height: 220px;
            border: 1px solid rgba(0,0,0,0.06);
        }

        .service-card h3 {
            color: #101010;
            margin-bottom: 10px;
        }

        .service-card p {
            color: #3f3f3f;
            line-height: 1.5;
            flex: 1;
        }

        .provider {
            margin-top: 12px;
            font-size: 14px;
            color: #323232;
        }

        .book-btn {
            margin-top: 18px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: var(--text-dark);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(182,255,74,0.2);
        }

        .book-btn:hover {
            background: var(--accent-strong);
        }

        .cancel-btn {
            margin-top: 12px;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background: var(--danger);
            color: white;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .cancel-btn:hover {
            background: var(--danger-strong);
        }

        .empty {
            background: var(--panel);
            color: var(--muted);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .booking-section {
            margin-top: 40px;
        }

        .booking-card {
            background: linear-gradient(180deg, #101d18, #0b120d);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 6px 18px var(--shadow);
            border: 1px solid var(--border);
        }

        .booking-card h3 {
            color: var(--accent);
            margin-bottom: 10px;
        }

        .booking-row {
            margin: 6px 0;
            color: var(--text);
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 7px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            background: rgba(182,255,74,0.12);
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .emergency {
            margin-top: 40px;
            background: linear-gradient(135deg, #0e1512, #040605);
            border: 1px solid var(--border);
            color: white;
            padding: 28px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .emergency h2 {
            margin-bottom: 8px;
            color: var(--accent);
        }

        .emergency p {
            color: var(--muted);
        }

        .emergency-btn {
            border: none;
            padding: 13px 20px;
            border-radius: 10px;
            background: var(--accent);
            color: var(--text-dark);
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 0 18px rgba(182,255,74,0.2);
        }

        .account-section {
            margin-top: 35px;
            text-align: right;
        }

        .delete-btn {
            border: 1px solid var(--danger);
            background: transparent;
            color: #ffb1b1;
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: var(--danger);
            color: white;
        }

        @media (max-width: 700px) {

            header {
                padding: 15px 20px;
                flex-direction: column;
                align-items: flex-start;
            }

            .header-right {
                width: 100%;
                justify-content: space-between;
            }

            .emergency {
                flex-direction: column;
                align-items: flex-start;
            }

            .emergency-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="brand">
        LOCAL SERVICES
    </div>

    <div class="header-right">

        <span class="user-name" id="userName">
            Customer
        </span>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>

</header>


<div class="container">

    <div class="welcome">

        <h1>
            Welcome, <span id="welcomeName">Customer</span>!
        </h1>

        <p>
            Find trusted local professionals and book
            the service you need.
        </p>

    </div>


    <h2 class="section-title">
        Browse Services
    </h2>


    <div class="categories">

        <button class="category-btn active"
                onclick="filterServices('ALL', this)">
            All
        </button>

        <button class="category-btn"
                onclick="filterServices('Electrician', this)">
            Electrician
        </button>

        <button class="category-btn"
                onclick="filterServices('Plumber', this)">
            Plumber
        </button>

        <button class="category-btn"
                onclick="filterServices('Carpenter', this)">
            Carpenter
        </button>

        <button class="category-btn"
                onclick="filterServices('AC Technician', this)">
            AC Technician
        </button>

        <button class="category-btn"
                onclick="filterServices('Appliance Repair', this)">
            Appliance Repair
        </button>

        <button class="category-btn"
                onclick="filterServices('Painter', this)">
            Painter
        </button>

        <button class="category-btn"
                onclick="filterServices('Pest Control', this)">
            Pest Control
        </button>

        <button class="category-btn"
                onclick="filterServices('Gardener', this)">
            Gardener
        </button>

        <button class="category-btn"
                onclick="filterServices('Electronics Repair', this)">
            Electronics Repair
        </button>

        <button class="category-btn"
                onclick="filterServices('Vehicle Mechanic', this)">
            Vehicle Mechanic
        </button>

    </div>


    <div id="servicesContainer"
         class="services-grid">

        <div class="empty">
            Loading services...
        </div>

    </div>


    <div class="booking-section">

        <h2 class="section-title">
            My Bookings
        </h2>

        <div id="bookingsContainer">

            <div class="empty">
                Loading bookings...
            </div>

        </div>

    </div>


    <div class="emergency">

        <div>

            <h2>
                Need Emergency Help?
            </h2>

            <p>
                Request an available nearby professional
                for urgent service.
            </p>

        </div>

        <button class="emergency-btn"
                onclick="openEmergency()">
            Request Emergency Service
        </button>

    </div>


    <div class="account-section">

        <button class="delete-btn"
                onclick="deleteAccount()">
            Delete My Account
        </button>

    </div>

</div>


<script>

const userId =
    localStorage.getItem("userId");

const userName =
    localStorage.getItem("userName");


if (!userId) {
    window.location.href = "login.html";
}


document.getElementById("userName")
    .textContent = userName || "Customer";

document.getElementById("welcomeName")
    .textContent = userName || "Customer";


let allServices = [];
let allProviders = [];


/* =========================
   LOAD SERVICES
========================= */

async function loadServices() {

    const container =
        document.getElementById("servicesContainer");

    try {

        const response =
            await fetch("/api/services");

        if (!response.ok) {
            throw new Error("Unable to load services");
        }

        allServices =
            await response.json();

        displayServices(allServices);

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Unable to load services.
                Please try again.
            </div>
        `;
    }
}


/* =========================
   LOAD PROVIDERS
========================= */

async function loadProviders() {

    try {

        const response =
            await fetch("/api/providers");

        if (!response.ok) {
            throw new Error("Unable to load providers");
        }

        allProviders =
            await response.json();

    } catch (error) {

        console.error("Provider loading error:", error);

        allProviders = [];
    }
}


/* =========================
   GET PROVIDER NAME
========================= */

function getProviderName(providerId) {

    if (!providerId) {
        return "Not assigned";
    }

    const provider =
        allProviders.find(
            p => Number(p.id) === Number(providerId)
        );

    if (!provider) {
        return "Provider #" + providerId;
    }

    return provider.businessName ||
           provider.name ||
           "Provider #" + providerId;
}


/* =========================
   GET SERVICE NAME
========================= */

function getServiceName(serviceId) {

    if (!serviceId) {
        return "Service not specified";
    }

    const service =
        allServices.find(
            s => Number(s.id) === Number(serviceId)
        );

    if (!service) {
        return "Service #" + serviceId;
    }

    return service.serviceName ||
           "Service #" + serviceId;
}


/* =========================
   CATEGORY DETECTION
========================= */

function getCategory(service) {

    const text =
        (
            service.serviceName +
            " " +
            (service.description || "")
        ).toLowerCase();


    if (
        text.includes("appliance") ||
        text.includes("washing machine") ||
        text.includes("refrigerator") ||
        text.includes("fridge")
    ) {
        return "Appliance Repair";
    }


    if (
        text.includes("electric") ||
        text.includes("wiring") ||
        text.includes("fan") ||
        text.includes("light")
    ) {
        return "Electrician";
    }


    if (
        text.includes("plumb") ||
        text.includes("pipe") ||
        text.includes("tap")
    ) {
        return "Plumber";
    }


    if (
        text.includes("carpent") ||
        text.includes("furniture") ||
        text.includes("wood")
    ) {
        return "Carpenter";
    }


    if (
        text.includes("ac ") ||
        text.includes("ac service") ||
        text.includes("air conditioner") ||
        text.includes("cooling")
    ) {
        return "AC Technician";
    }


    if (text.includes("paint")) {
        return "Painter";
    }


    if (
        text.includes("pest") ||
        text.includes("insect")
    ) {
        return "Pest Control";
    }


    if (
        text.includes("garden") ||
        text.includes("gardener")
    ) {
        return "Gardener";
    }


    if (
        text.includes("electronic") ||
        text.includes("mobile") ||
        text.includes("tv")
    ) {
        return "Electronics Repair";
    }


    if (
        text.includes("vehicle") ||
        text.includes("car") ||
        text.includes("bike") ||
        text.includes("mechanic")
    ) {
        return "Vehicle Mechanic";
    }


    return "Other";
}


/* =========================
   DISPLAY SERVICES
========================= */

function displayServices(services) {

    const container =
        document.getElementById("servicesContainer");


    if (!services.length) {

        container.innerHTML = `
            <div class="empty">
                No services available in this category.
            </div>
        `;

        return;
    }


    container.innerHTML =
        services.map(service => {

            return `

                <div class="service-card">

                    <h3>
                        ${escapeHtml(service.serviceName)}
                    </h3>

                    <p>
                        ${escapeHtml(
                            service.description ||
                            "Professional local service."
                        )}
                    </p>

                    <div class="provider">
                        Provider:
                        ${escapeHtml(
                            getProviderName(service.providerId)
                        )}
                    </div>

                    <button
                        class="book-btn"
                        onclick="bookService(${service.id})">

                        Book This Service

                    </button>

                </div>

            `;

        }).join("");
}


/* =========================
   FILTER SERVICES
========================= */

function filterServices(category, button) {

    document.querySelectorAll(".category-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");


    if (category === "ALL") {

        displayServices(allServices);

        return;
    }


    const filtered =
        allServices.filter(service => {

            const serviceName =
                (service.serviceName || "")
                    .toLowerCase();

            const description =
                (service.description || "")
                    .toLowerCase();


            if (category === "Appliance Repair") {

                return serviceName.includes("appliance")
                    || description.includes("appliance")
                    || description.includes("fridge")
                    || description.includes("washing machine")
                    || description.includes("refrigerator")
                    || description.includes("tv repair");
            }


            return getCategory(service) === category;
        });


    displayServices(filtered);
}


/* =========================
   BOOK SERVICE
========================= */

function bookService(serviceId) {

    window.location.href =
        `booking.html?serviceId=${serviceId}`;
}


/* =========================
   LOAD BOOKINGS
========================= */

async function loadBookings() {

    const container =
        document.getElementById("bookingsContainer");

    try {

        const response =
            await fetch(
                `/api/bookings/customer/${userId}`
            );

        if (!response.ok) {
            throw new Error("Unable to load bookings");
        }

        const bookings =
            await response.json();


        if (!bookings.length) {

            container.innerHTML = `
                <div class="empty">
                    You have no bookings yet.
                </div>
            `;

            return;
        }


        container.innerHTML =
            bookings.map(booking => {

                const canCancel =
                    booking.status === "PENDING" ||
                    booking.status === "ACCEPTED";


                const serviceName =
                    getServiceName(booking.serviceId);

                const providerName =
                    getProviderName(booking.providerId);


                return `

                    <div class="booking-card">

                        <h3>
                            Booking #${booking.id}
                        </h3>

                        <div class="booking-row">
                            Service:
                            ${escapeHtml(serviceName)}
                        </div>

                        <div class="booking-row">
                            Provider:
                            ${escapeHtml(providerName)}
                        </div>

                        <div class="booking-row">
                            Date:
                            ${booking.bookingDate}
                        </div>

                        <div class="booking-row">
                            Time:
                            ${booking.bookingTime || "Not specified"}
                        </div>

                        <div class="booking-row">
                            Address:
                            ${escapeHtml(
                                booking.address ||
                                "Not provided"
                            )}
                        </div>

                        <div class="booking-row">
                            Payment:
                            Offline — pay provider directly
                        </div>

                        <span class="status">
                            ${escapeHtml(booking.status)}
                        </span>


                        ${
                            canCancel
                            ? `
                                <button
                                    class="cancel-btn"
                                    onclick="cancelBooking(${booking.id})">

                                    Cancel Booking

                                </button>
                              `
                            : ""
                        }

                    </div>

                `;

            }).join("");


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Unable to load bookings.
            </div>
        `;
    }
}


/* =========================
   CANCEL BOOKING
========================= */

async function cancelBooking(bookingId) {

    const confirmed =
        confirm(
            "Are you sure you want to cancel this booking?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/bookings/${bookingId}/status?status=CANCELLED`,
                {
                    method: "PUT"
                }
            );


        if (!response.ok) {

            const error =
                await response.text();

            alert(
                error ||
                "Unable to cancel booking."
            );

            return;
        }


        alert(
            "Booking cancelled successfully."
        );


        loadBookings();


    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to the server."
        );
    }
}


/* =========================
   EMERGENCY
========================= */

function openEmergency() {

    window.location.href =
        "emergency.html";
}


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem("userId");
    localStorage.removeItem("userName");
    localStorage.removeItem("username");
    localStorage.removeItem("userRole");

    window.location.href =
        "login.html";
}


/* =========================
   DELETE ACCOUNT
========================= */

async function deleteAccount() {

    const confirmed =
        confirm(
            "Are you sure you want to permanently delete your account?"
        );


    if (!confirmed) {
        return;
    }


    const userId =
        localStorage.getItem("userId");


    if (!userId) {

        alert(
            "Please login again."
        );

        window.location.href =
            "login.html";

        return;
    }


    try {

        const response =
            await fetch(
                `/api/users/${userId}`,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.text();


        if (!response.ok) {

            alert(
                result ||
                "Unable to delete account."
            );

            return;
        }


        alert(
            "Your account has been deleted successfully."
        );


        localStorage.clear();

        window.location.href =
            "index.html";


    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to the server."
        );
    }
}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null ? "" : value;

    return div.innerHTML;
}


/* =========================
   INITIAL LOAD
========================= */

async function initializeDashboard() {

    await Promise.all([
        loadServices(),
        loadProviders()
    ]);

    await loadBookings();
}


initializeDashboard();

</script>
</body>
</html>
