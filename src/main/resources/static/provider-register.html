<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Provider Registration | Local Services</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f4f0e6, #ede4ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #6c3bd1;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        select,
        textarea {
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #7c3aed;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #7c3aed;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6426c5;
        }

        .message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #7c3aed;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Become a Service Provider</h1>
        <p>Register your local service business and connect with customers.</p>
    </div>

    <form id="providerForm">

        <div class="form-grid">

            <div class="field">
                <label>Full Name *</label>
                <input type="text" id="name" required>
            </div>

            <div class="field">
                <label>Email *</label>
                <input type="email" id="email" required>
            </div>

            <div class="field">
                  <label>Username *</label>
                  <input type="text" id="username" required
                      pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,29}"
                      title="Use 3-30 letters, numbers, '.', '_' or '-'.">
            </div>

            <div class="field">
                <label>Password *</label>
                <input type="password" id="password" required>
            </div>

            <div class="field">
                <label>Business Name *</label>
                <input type="text" id="businessName" required>
            </div>

            <div class="field">
                <label>Service Category *</label>

                <select id="category" required>
                    <option value="">Select Category</option>
                    <option>Electrician</option>
                    <option>Plumber</option>
                    <option>Carpenter</option>
                    <option>AC Technician</option>
                    <option>Appliance Repair</option>
                    <option>Painter</option>
                    <option>Pest Control</option>
                    <option>Gardener</option>
                    <option>Electronics Repair</option>
                    <option>Vehicle Mechanic</option>
                </select>
            </div>

            <div class="field">
                <label>Experience (Years)</label>
                <input type="number" id="experience" min="0" value="0">
            </div>

            <div class="field">
                <label>Location *</label>
                <input type="text" id="location"
                       placeholder="Example: Chennai"
                       required>
            </div>

            <div class="field full">
                <label>Business Description</label>
                <textarea id="description"
                          placeholder="Describe the services you provide..."></textarea>
            </div>

        </div>

        <button type="submit">
            Register as Service Provider
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login-link">
        Already registered?
        <a href="login.html">Provider Login</a>
    </div>

</div>

<script>

document.getElementById("providerForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const message = document.getElementById("message");

    const data = {
        name: document.getElementById("name").value.trim(),
        username: document.getElementById("username").value.trim().toLowerCase(),
        password: document.getElementById("password").value,
        email: document.getElementById("email").value.trim().toLowerCase(),

        businessName:
            document.getElementById("businessName").value.trim(),

        category:
            document.getElementById("category").value,

        experience:
            document.getElementById("experience").value,

        location:
            document.getElementById("location").value.trim(),

        description:
            document.getElementById("description").value.trim()
    };

    message.textContent = "Registering...";

    try {

        const response = await fetch(
            "/api/users/provider-register",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            }
        );

        const result = await response.json()
            .catch(() => null);

        if (!response.ok) {

            message.textContent =
                result || "Registration failed.";

            return;
        }

        message.textContent =
            "Registration successful! Redirecting to login...";

        document.getElementById("providerForm").reset();

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);

    } catch (error) {

        console.error(error);

        message.textContent =
            "Unable to connect to the server.";
    }

});

</script>

</body>
</html>
