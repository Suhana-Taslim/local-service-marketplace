<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Local Service Marketplace</title>

    <style>
        :root {
            --bg: #050807;
            --panel: #0f1714;
            --text: #f4f9f5;
            --text-dark: #101010;
            --muted: #b7c8bb;
            --accent: #b6ff4a;
            --accent-strong: #8af507;
            --border: rgba(182,255,74,0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #112018 0%, #050807 38%, #020403 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
        }

        .container {
            width: 90%;
            max-width: 420px;
            background: linear-gradient(180deg, #0f1714, #0a120f);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            border: 1px solid var(--border);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--accent);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid rgba(182,255,74,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            color: white;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(182,255,74,0.12);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: var(--text-dark);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(182,255,74,0.2);
        }

        button:hover {
            background: var(--accent-strong);
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            color: var(--accent);
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Login</h1>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,29}"
            title="Use 3-30 letters, numbers, '.', '_' or '-'."
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <div id="message" class="message"></div>

    <p class="home"><a href="register.html">Create a customer account</a></p>
    <p class="home"><a href="provider-register.html">Create a provider account</a></p>
    <p class="home"><a href="forgot-password.html">Forgot password?</a></p>

    <a href="index.html" class="home">← Back to Home</a>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const username = document.getElementById("username").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    message.textContent = "Logging in...";

    try {

        const response = await fetch("/api/users/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: username,
                password: password
            })

        });

        const result = await response.json();

        console.log("LOGIN RESPONSE:", result);

        if (!response.ok) {

            message.textContent = result;
            return;

        }

        // Save logged-in user information
        localStorage.setItem("userId", result.id);
        localStorage.setItem("userName", result.name);
        localStorage.setItem("username", result.username);
        localStorage.setItem("userRole", result.role);

        const role = String(result.role).trim().toUpperCase();

        message.textContent = "Login successful!";

        // Provider → Provider Dashboard
        if (role === "PROVIDER") {

            window.location.replace("provider.html");

        }

        // Customer → Customer Dashboard
        else {

            window.location.replace("customer.html");

        }

    } catch (error) {

        console.error(error);

        message.textContent = "Unable to connect to server.";

    }

});

</script>

</body>
</html>
