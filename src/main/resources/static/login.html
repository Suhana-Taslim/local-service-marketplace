<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Local Service Marketplace</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f0e6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #21152b;
        }

        .container {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #6c63ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5148d8;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6c63ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Login</h1>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,29}"
            title="Use 3-30 letters, numbers, '.', '_' or '-'."
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <div id="message" class="message"></div>

    <a href="index.html" class="home">← Back to Home</a>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const username = document.getElementById("username").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    message.textContent = "Logging in...";

    try {

        const response = await fetch("/api/users/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: username,
                password: password
            })

        });

        const result = await response.json();

        console.log("LOGIN RESPONSE:", result);

        if (!response.ok) {

            message.textContent = result;
            return;

        }

        // Save logged-in user information
        localStorage.setItem("userId", result.id);
        localStorage.setItem("userName", result.name);
        localStorage.setItem("username", result.username);
        localStorage.setItem("userRole", result.role);

        const role = String(result.role).trim().toUpperCase();

        message.textContent = "Login successful!";

        // Provider → Provider Dashboard
        if (role === "PROVIDER") {

            window.location.replace("provider.html");

        }

        // Customer → Customer Dashboard
        else {

            window.location.replace("customer.html");

        }

    } catch (error) {

        console.error(error);

        message.textContent = "Unable to connect to server.";

    }

});

</script>

</body>
</html>
