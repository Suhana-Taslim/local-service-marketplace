<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Customer Account - Local Service Marketplace</title>
    <style>
        :root {
            --bg: #050807;
            --panel: #0f1714;
            --text: #f4f9f5;
            --text-dark: #101010;
            --accent: #b6ff4a;
            --accent-strong: #8af507;
            --border: rgba(182,255,74,0.35);
        }

        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #112018 0%, #050807 38%, #020403 100%); color: var(--text); }
        .container { width: min(92%, 430px); padding: 34px; background: linear-gradient(180deg, #0f1714, #0a120f); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,.32); }
        h1 { margin-top: 0; text-align: center; color: var(--accent); }
        input, button { width: 100%; padding: 12px; margin: 8px 0 14px; border-radius: 8px; }
        input { border: 1px solid rgba(182,255,74,0.3); background: rgba(255,255,255,0.02); color: white; }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(182,255,74,0.12); }
        button { border: 0; background: var(--accent); color: var(--text-dark); font-weight: bold; cursor: pointer; box-shadow: 0 0 18px rgba(182,255,74,0.2); }
        .message, .links { margin-top: 14px; text-align: center; color: var(--text); }
        a { color: var(--accent); }
    </style>
</head>
<body>
<div class="container">
    <h1>Create Customer Account</h1>
    <form id="registerForm">
        <input id="name" placeholder="Full name" required>
        <input id="username" placeholder="Username" pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,29}" title="Use 3-30 letters, numbers, '.', '_' or '-'." required>
        <input id="email" type="email" placeholder="Email address" required>
        <input id="password" type="password" placeholder="Password" minlength="8" required>
        <button type="submit">Create Account</button>
    </form>
    <div id="message" class="message"></div>
    <div class="links">Already registered? <a href="login.html">Log in</a></div>
</div>
<script>
document.getElementById("registerForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = document.getElementById("message");
    const data = {
        name: document.getElementById("name").value.trim(),
        username: document.getElementById("username").value.trim().toLowerCase(),
        email: document.getElementById("email").value.trim().toLowerCase(),
        password: document.getElementById("password").value
    };
    message.textContent = "Creating account...";
    try {
        const response = await fetch("/api/users/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
        const result = await response.text();
        message.textContent = response.ok ? "Account created. Check your email to verify it before logging in." : result;
        if (response.ok) document.getElementById("registerForm").reset();
    } catch (error) {
        message.textContent = "Unable to connect to the server.";
    }
});
</script>
</body>
</html>
