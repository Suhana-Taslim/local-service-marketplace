<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Customer Account - Local Service Marketplace</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f0e6; color: #21152b; }
        .container { width: min(92%, 430px); padding: 34px; background: #fff; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,.12); }
        h1 { margin-top: 0; text-align: center; }
        input, button { width: 100%; padding: 12px; margin: 8px 0 14px; border-radius: 8px; }
        input { border: 1px solid #ccc; }
        button { border: 0; background: #6c63ff; color: #fff; font-weight: bold; cursor: pointer; }
        .message, .links { margin-top: 14px; text-align: center; }
        a { color: #5148d8; }
    </style>
</head>
<body>
<div class="container">
    <h1>Create Customer Account</h1>
    <form id="registerForm">
        <input id="name" placeholder="Full name" required>
        <input id="username" placeholder="Username" pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,29}" title="Use 3-30 letters, numbers, '.', '_' or '-'." required>
        <input id="email" type="email" placeholder="Email address" required>
        <input id="password" type="password" placeholder="Password" minlength="8" required>
        <button type="submit">Create Account</button>
    </form>
    <div id="message" class="message"></div>
    <div class="links">Already registered? <a href="login.html">Log in</a></div>
</div>
<script>
document.getElementById("registerForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = document.getElementById("message");
    const data = {
        name: document.getElementById("name").value.trim(),
        username: document.getElementById("username").value.trim().toLowerCase(),
        email: document.getElementById("email").value.trim().toLowerCase(),
        password: document.getElementById("password").value
    };
    message.textContent = "Creating account...";
    try {
        const response = await fetch("/api/users/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
        const result = await response.text();
        message.textContent = response.ok ? "Account created. Check your email to verify it before logging in." : result;
        if (response.ok) document.getElementById("registerForm").reset();
    } catch (error) {
        message.textContent = "Unable to connect to the server.";
    }
});
</script>
</body>
</html>
