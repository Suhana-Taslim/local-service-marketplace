<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Local Service Marketplace</title>
    <style>
        :root {
            --bg: #050807;
            --panel: #0f1714;
            --text: #f4f9f5;
            --text-dark: #101010;
            --accent: #b6ff4a;
            --accent-strong: #8af507;
            --border: rgba(182,255,74,0.35);
        }

        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #112018 0%, #050807 38%, #020403 100%); color: var(--text); }
        .container { width: min(92%, 430px); padding: 34px; background: linear-gradient(180deg, #0f1714, #0a120f); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,.32); }
        h1 { margin-top: 0; text-align: center; color: var(--accent); }
        input, button { width: 100%; padding: 12px; margin: 8px 0 14px; border-radius: 8px; }
        input { border: 1px solid rgba(182,255,74,0.3); background: rgba(255,255,255,0.02); color: white; }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(182,255,74,0.12); }
        button { border: 0; background: var(--accent); color: var(--text-dark); font-weight: bold; cursor: pointer; box-shadow: 0 0 18px rgba(182,255,74,0.2); }
        .message, .links { margin-top: 14px; text-align: center; }
        a { color: var(--accent); }
    </style>
</head>
<body>
<div class="container">
    <h1>Forgot Password</h1>
    <p>Enter your username and verified email address. We will send a reset link if they match.</p>
    <form id="forgotForm">
        <input id="username" placeholder="Username" required>
        <input id="email" type="email" placeholder="Email address" required>
        <button type="submit">Send Reset Link</button>
    </form>
    <div id="message" class="message"></div>
    <div class="links"><a href="login.html">Back to login</a></div>
</div>
<script>
document.getElementById("forgotForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = document.getElementById("message");
    try {
        const response = await fetch("/api/users/forgot-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
            username: document.getElementById("username").value.trim().toLowerCase(),
            email: document.getElementById("email").value.trim().toLowerCase()
        }) });
        message.textContent = await response.text();
    } catch (error) {
        message.textContent = "Unable to connect to the server.";
    }
});
</script>
</body>
</html>
