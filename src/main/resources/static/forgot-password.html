<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Local Service Marketplace</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f0e6; color: #21152b; }
        .container { width: min(92%, 430px); padding: 34px; background: #fff; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,.12); }
        h1 { margin-top: 0; text-align: center; }
        input, button { width: 100%; padding: 12px; margin: 8px 0 14px; border-radius: 8px; }
        input { border: 1px solid #ccc; }
        button { border: 0; background: #6c63ff; color: #fff; font-weight: bold; cursor: pointer; }
        .message, .links { margin-top: 14px; text-align: center; }
        a { color: #5148d8; }
    </style>
</head>
<body>
<div class="container">
    <h1>Forgot Password</h1>
    <p>Enter your username and verified email address. We will send a reset link if they match.</p>
    <form id="forgotForm">
        <input id="username" placeholder="Username" required>
        <input id="email" type="email" placeholder="Email address" required>
        <button type="submit">Send Reset Link</button>
    </form>
    <div id="message" class="message"></div>
    <div class="links"><a href="login.html">Back to login</a></div>
</div>
<script>
document.getElementById("forgotForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = document.getElementById("message");
    try {
        const response = await fetch("/api/users/forgot-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
            username: document.getElementById("username").value.trim().toLowerCase(),
            email: document.getElementById("email").value.trim().toLowerCase()
        }) });
        message.textContent = await response.text();
    } catch (error) {
        message.textContent = "Unable to connect to the server.";
    }
});
</script>
</body>
</html>
