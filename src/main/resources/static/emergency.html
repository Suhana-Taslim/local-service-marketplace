<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Service | Local Services</title>

    <style>
        :root {
            --bg: #050807;
            --panel: #0f1714;
            --text: #f4f9f5;
            --text-dark: #101010;
            --muted: #b7c8bb;
            --accent: #b6ff4a;
            --accent-strong: #8af507;
            --border: rgba(182,255,74,0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, #112018 0%, #050807 38%, #020403 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: linear-gradient(180deg, #0f1714, #0a120f);
            border: 1px solid var(--border);
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.32);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--accent);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--muted);
        }

        .notice {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 22px;
            color: var(--text);
            line-height: 1.5;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: white;
        }

        select,
        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid rgba(182,255,74,0.3);
            border-radius: 10px;
            font-size: 15px;
            background: rgba(255,255,255,0.02);
            color: white;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: var(--text-dark);
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(182,255,74,0.2);
        }

        button:hover {
            background: var(--accent-strong);
        }

        .message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            color: var(--accent);
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Emergency Service</h1>
        <p>Get urgent help from an available local professional.</p>
    </div>

    <div class="notice">
        <strong>How it works:</strong>
        Your request is matched with an available provider
        for the selected service category. If location details
        are available, the system selects the nearest suitable provider.
    </div>

    <form id="emergencyForm">

        <div class="field">

            <label for="serviceCategory">
                Emergency Service *
            </label>

            <select id="serviceCategory" required>

                <option value="">
                    Select a service
                </option>

                <option>Electrician</option>
                <option>Plumber</option>
                <option>Carpenter</option>
                <option>AC Technician</option>
                <option>Appliance Repair</option>
                <option>Painter</option>
                <option>Pest Control</option>
                <option>Gardener</option>
                <option>Electronics Repair</option>
                <option>Vehicle Mechanic</option>

            </select>

        </div>


        <div class="field">

            <label for="description">
                Describe the Emergency
            </label>

            <textarea
                id="description"
                placeholder="Explain what happened and what help you need..."
            ></textarea>

        </div>


        <div class="field">

            <label for="address">
                Service Address *
            </label>

            <textarea
                id="address"
                placeholder="Enter the location where help is required"
                required
            ></textarea>

        </div>


        <button type="submit">
            Request Emergency Help
        </button>

    </form>


    <div id="message" class="message"></div>


    <div class="back">
        <a href="customer.html">
            ← Back to Customer Dashboard
        </a>
    </div>

</div>


<script>

const userId =
    localStorage.getItem("userId");


if (!userId) {

    alert("Please login first.");

    window.location.href =
        "login.html";
}


document
    .getElementById("emergencyForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const message =
            document.getElementById("message");


        const request = {

            customerId: Number(userId),

            serviceCategory:
                document.getElementById(
                    "serviceCategory"
                ).value,

            description:
                document.getElementById(
                    "description"
                ).value.trim(),

            address:
                document.getElementById(
                    "address"
                ).value.trim()

        };


        message.textContent =
            "Finding an available provider...";


        try {

            const response =
                await fetch(
                    "/api/emergency",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(request)
                    }
                );


            if (!response.ok) {

                const error =
                    await response.text();

                message.textContent =
                    error ||
                    "Emergency request failed.";

                return;
            }


            const result =
                await response.json();


            if (result.status === "MATCHED") {

                message.textContent =
                    "Emergency request matched with a suitable provider! Request ID: "
                    + result.id;

            } else {

                message.textContent =
                    "Request submitted, but no suitable provider is currently available. Request ID: "
                    + result.id;
            }


            document
                .getElementById("emergencyForm")
                .reset();


        } catch (error) {

            console.error(error);

            message.textContent =
                "Unable to connect to the server.";
        }

    });

</script>

</body>
</html>
